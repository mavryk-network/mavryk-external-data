openapi: 3.0.3

servers:
  - url: /
    description: Current host (works for both local dev and production)

info:
  title: Mavryk External Data API
  version: "2.5.0"
  description: |
    Long-format price service.

      * **FT prices** — CoinGecko-sourced quotes per (token, currency).
      * **RWA prices** — Equiteez orderbook prices per (pair, side).
      * **Tickers** — CoinGecko-sourced per-exchange ticker data (price,
        24h volume, 1D change %) plus volume-distribution pie chart data
        for a given token.

    FT and RWA prices are returned as **JSON numbers**: rounded to 6 decimal
    places at or above 0.01, and to 6 significant digits below it, so a
    sub-microunit quote (a BTC- or ETH-denominated price) keeps its value
    instead of collapsing to `0.000001` or `0`. The relative rounding error is
    bounded at 5e-5 across the whole range. Ticker endpoints are the
    exception: their prices/volumes are full-precision JSON **strings** (see
    `TickersSnapshot`).
    Timestamps are RFC3339 in UTC.

    **2.5.0 wire changes** (vs 2.4.0): sub-0.01 prices switched from a flat
    6-decimal grid to 6 significant digits; chart latest mode and over-full
    chart windows now return the NEWEST buckets; `RWAPrice`/`RWAChangeResponse`
    and the `/v1/rwa` overview gained an `fx` stale-rate marker;
    `market`/`primary_issuance` are documented as always-present facets;
    `/quotes` gained a default `limit`; 401/403 and their error codes were
    added; ticker `change_24h_pct` anchors inside a `[ts-25h, ts-24h]`
    bracket.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  contact:
    name: API Support
    url: https://github.com/0xVoronov/mavryk-external-data


tags:
  - name: health
    description: Liveness, readiness, metrics
  - name: prices-ft
    description: Fungible-token quotes (CoinGecko)
  - name: prices-rwa
    description: RWA orderbook prices (Equiteez)
  - name: charts-ft
    description: |
      Time-series charts (line, OHLC, OHLCV) over `token_prices`.
      Ships `/series` and `/ohlc` for `1m / 5m / 15m / 1h / 4h / 1d`;
      `/ohlcv` returns 501 until volume ingestion lands.
  - name: charts-rwa
    description: |
      Time-series charts (line, OHLC, OHLCV) over `rwa_quote_prices`. Same
      DTO shape as `charts-ft`; uses the `last` orderbook side for every
      bucket. Pre-deploy history depends on `equiteez_backfill.go` having
      been enabled.
      `/ohlcv` shares the same 501 stub as `charts-ft` until volume
      ingestion lands.
  - name: prices-tickers
    description: |
      Per-exchange market data for a token (CoinGecko `/coins/{id}/tickers`).
      List of exchanges trading the token with price + 24h volume + 1D
      change %, plus a pie-chart `/distribution` endpoint that aggregates
      volume by exchange or quote currency. Conversion to any supported
      `?in=usd,eur,...` happens read-side via the same FX rates used by
      `prices-rwa`.
  - name: discovery
    description: |
      Catalog endpoints for clients that need to know which entities are
      available before querying the data endpoints.

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      description: Returns 200 as long as the process is running. Does **not** depend on the database — use `/readyz` for readiness.
      operationId: liveness
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LivenessResponse" }

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      description: |
        Returns 200 when the service can serve traffic, 503 otherwise.
        Currently checks (a) the readiness gate (flipped during graceful
        shutdown) and (b) database connectivity (`Ping` with 2s timeout).
      operationId: readiness
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessResponse" }
        "503":
          description: Not ready (draining or DB unreachable).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessResponse" }

  /metrics:
    get:
      tags: [health]
      summary: Prometheus metrics
      description: |
        Prometheus exposition format. **Listener caveat:** with
        `server.internal_port` set, `/metrics` is served on the INTERNAL
        listener only; in single-port mode it appears on the public listener
        only outside release mode (a release single-port deploy has no
        `/metrics` at all — set the internal port).

        See `internal/metrics/prometheus.go` for the registered collectors:

          * `http_*` — request counts, latencies, response classes.
          * `outbound_http_*` — retries, CB transitions, CB current state, RL wait.
          * `job_*` — tick duration, error counters, rows written, last-success timestamp.
          * `backfill_*` — oldest_ts cursor, auto-disable counter.
          * `db_pool_*` — connection pool stats.
      operationId: metrics
      responses:
        "200":
          description: Plaintext Prometheus metrics.
          content:
            text/plain:
              schema:
                type: string

  /quotes:
    get:
      tags: [health]
      summary: Legacy wide-format quotes (deprecated)
      deprecated: true
      description: |
        Pre-v1 compatibility endpoint: MVRK prices pivoted into one row per
        timestamp with a fixed currency column set, values as JSON numbers
        (float64 — NOT the v1 precision contract). Superseded by
        `/v1/prices/{token}`; new integrations must not use it.

        `from`/`to` are RFC3339 and the window is unbounded. `limit` is
        validated against `server.max_query_limit` and **defaults to it** when
        absent, so a response is always bounded. When a window holds more
        timestamps than the limit, the **oldest** are returned: re-issue with
        `from` set just past the last timestamp seen (both window bounds are
        inclusive) to page forward through history.
      operationId: legacyQuotes
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Array of wide rows, ts ASC.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    timestamp: { type: string, format: date-time }
                    btc: { type: number }
                    usd: { type: number }
                    eur: { type: number }
                    cny: { type: number }
                    jpy: { type: number }
                    krw: { type: number }
                    eth: { type: number }
                    gbp: { type: number }
        "400":
          description: |
            Invalid parameters. NOTE — this frozen route keeps its v0.1.0
            error envelope `{"error": "..."}`, NOT the v1 `{code, message}`
            envelope (only the 429, written by shared middleware, uses the
            v1 shape).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500":
          description: Query failure, in the frozen v0.1.0 envelope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyErrorResponse" }

  /v1/prices/{token}:
    get:
      tags: [prices-ft]
      summary: List FT price points
      description: |
        Returns price points for `token` from `coingecko`.

          * No `from`/`to` → "latest" mode: freshest price per currency.
          * Either `from` or `to` set → window mode; missing side defaults
            to `now-24h` / `now`.
          * `currency` filters the returned metrics; comma-separated.

        `limit` is capped by `server.max_query_limit`; exceeding returns 400.
      operationId: listTokenPrices
      parameters:
        - $ref: "#/components/parameters/Token"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/CurrencyFilter"
      responses:
        "200":
          description: Array of price points.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TokenPricePoint" }
              example:
                - { timestamp: "2026-04-27T12:00:00Z", currency: usd, price: 0.071541 }
                - { timestamp: "2026-04-27T12:00:00Z", currency: eur, price: 0.060941 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/prices/{token}/latest:
    get:
      tags: [prices-ft]
      summary: Latest snapshot for a token
      description: |
        Returns the freshest price for each currency, transposed into a
        single Snapshot object — the spiritual replacement for the legacy
        `/quotes/last` endpoint.
      operationId: latestTokenSnapshot
      parameters:
        - $ref: "#/components/parameters/Token"
      responses:
        "200":
          description: Snapshot of latest prices, one per currency.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
              example:
                timestamp: "2026-04-27T12:00:00Z"
                values: { usd: 0.071541, eur: 0.060941 }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/prices/{token}/count:
    get:
      tags: [prices-ft]
      summary: Total row count for a token
      description: |
        Total raw row count in `token_prices` for `(token, source=coingecko)`.
        Useful for capacity planning and monitoring; not paginated.
      operationId: countTokenPrices
      parameters:
        - $ref: "#/components/parameters/Token"
      responses:
        "200":
          description: Row count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountResponse" }
              example: { token: mvrk, count: 524160 }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/prices/{token}/change:
    get:
      tags: [prices-ft]
      summary: Price change over fixed periods (24h / 7d / 30d)
      description: |
        Returns price-change percentages for `{token}` per currency over
        each requested period. Both `now` and each period's anchor read
        from raw `token_prices` via single-row index seeks: `now` is the
        freshest sample, the anchor is the freshest sample at-or-before
        `now − Δ` (subject to a per-period staleness budget).

        **Top-level `as_of`** is `max(per-currency last_ts)`. Per-currency
        `now` may be staler than `as_of` for slow-tick currencies. When
        no currency has data yet, `as_of` is `null`.

        **Null fields.** When no anchor row falls inside the period's
        staleness budget (newly-registered token, ingestion gap), all
        four period fields render `null`. When the anchor exists but
        is `0` (degenerate price), `from` and `from_ts` stay populated
        but `delta_abs` and `change_pct` are `null`.

        **Period order.** The `periods` object renders keys in the
        order requested by the client (or `24h,7d,30d` when omitted).
        Object key order isn't semantic per JSON spec but stable order
        helps human readers and snapshot tests.
      operationId: tokenChange
      parameters:
        - $ref: "#/components/parameters/Token"
        - $ref: "#/components/parameters/CurrencyFilter"
        - $ref: "#/components/parameters/Periods"
      responses:
        "200":
          description: Price change response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FTChangeResponse" }
              example:
                token: mvrk
                as_of: "2026-05-08T12:00:00Z"
                currencies:
                  usd:
                    now: 0.071541
                    periods:
                      "24h": { from_ts: "2026-05-07T12:00:00Z", from: 0.0721, delta_abs: -0.000559, change_pct: -0.7754 }
                      "7d":  { from_ts: "2026-05-01T00:00:00Z", from: 0.0693, delta_abs: 0.002241, change_pct: 3.2338 }
                      "30d": { from_ts: null, from: null, delta_abs: null, change_pct: null }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/prices/{token}/series:
    get:
      tags: [charts-ft]
      summary: Line chart (close-price series)
      description: |
        Returns one `(t, p)` point per bucket — `p` is the bucket's
        close price. Backed by the matching continuous aggregate
        (`token_prices_1m` / `_1h` / `_1d`); 5m/15m/4h re-bucket on top
        of `_1m` and `_1h` at query time.

        Either `from`+`to` define a window or both are absent for
        latest mode — the NEWEST `limit` buckets (default 100), served in
        ascending order. A window holding more buckets than `limit` is
        truncated from the OLD end (the newest buckets are kept). Range
        caps per interval: `1m` ≤ 7 days, `1h` ≤ 1 year, `1d` unlimited.

        `currency` is required (one value, no comma-list).
      operationId: tokenSeries
      parameters:
        - $ref: "#/components/parameters/Token"
        - $ref: "#/components/parameters/Interval"
        - $ref: "#/components/parameters/ChartCurrency"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Series response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesResponse" }
              example:
                symbol: mvrk
                currency: usd
                kind: series
                interval: 1h
                points:
                  - { t: "2026-04-27T12:00:00Z", p: 0.071541 }
                  - { t: "2026-04-27T13:00:00Z", p: 0.072104 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "416": { $ref: "#/components/responses/RangeNotSatisfiable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/prices/{token}/ohlc:
    get:
      tags: [charts-ft]
      summary: OHLC candles
      description: |
        Returns one candle per bucket with `open / high / low / close`
        and a sample count (`n`). Volume is not on the wire — use
        `/ohlcv` once Stage 4 ships (currently 501).

        Same `interval` / range cap / `currency` semantics as `/series`.
      operationId: tokenOHLC
      parameters:
        - $ref: "#/components/parameters/Token"
        - $ref: "#/components/parameters/Interval"
        - $ref: "#/components/parameters/ChartCurrency"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OHLC response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OHLCResponse" }
              example:
                symbol: mvrk
                currency: usd
                kind: ohlc
                interval: 1h
                candles:
                  - { t: "2026-04-27T12:00:00Z", o: 0.071, h: 0.073, l: 0.070, c: 0.0721, n: 60 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "416": { $ref: "#/components/responses/RangeNotSatisfiable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/prices/{token}/ohlcv:
    get:
      tags: [charts-ft]
      summary: OHLCV candles (Stage 4 — TODO)
      description: |
        Reserved URL. Returns **501** with code `OHLCV_NOT_IMPLEMENTED`
        until volume ingestion ships. `token_prices`
        does not yet store volume; CoinGecko `/simple/price` doesn't
        return it. Frontend can build against this URL safely — the
        DTO shape is fixed (see `OHLCVResponse`).
      operationId: tokenOHLCV
      parameters:
        - $ref: "#/components/parameters/Token"
      responses:
        "501":
          description: OHLCV is parked until Stage 4.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                code: OHLCV_NOT_IMPLEMENTED
                message: "OHLCV is not yet available;"

  /v1/rwa:
    get:
      tags: [prices-rwa]
      summary: RWA market overview (list of assets with dynamic data)
      description: |
        Returns every enabled RWA asset with its latest price, 24h change, and a
        short 1-day close-price series (last 24h at 15m buckets, reusing the
        `/series` point shape `{t,p}`). Empty catalog returns `{ "assets": [] }`,
        not 404. Each asset carries its own `price_as_of`; `token_address` is the
        on-chain RWA token contract (null when not synced yet).

        `market` discriminates two kinds of asset:

          * `secondary` — trades on an Equiteez orderbook. `price` is the latest
            `last` quote; `change_24h` and `series_1d` are populated.
          * `primary` — sold on the launchpad, no orderbook yet. `price` is the
            fixed **base-tier** (undiscounted) sale price and the
            `primary_issuance` block carries sale progress. No trades exist, so
            `change_24h` is null and `series_1d.points` is empty.

        The two are **facets, not alternatives**. An asset that trades on an
        orderbook while still in primary issuance is listed **once**: `market`
        stays `secondary` (a live quote outranks a fixed one for the top-level
        `price`) and the `primary_issuance` block is present alongside, carrying
        its own `price`. Assets are keyed by `{base}-{quote}`, so the same token
        against two quote currencies is two distinct assets.

        `limit` applies to the merged, symbol-sorted catalog — primary-market
        assets are never starved by secondary ones.

        Auth applies on the public listener (see securitySchemes).
      operationId: listRWAOverview
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          description: Cap the number of assets returned; clamped to the server cap.
        - name: in
          in: query
          required: false
          schema: { type: string }
          description: >
            Single FX target currency (e.g. `usd`). Converts the latest price
            (flat top-level key per asset) and each mini-series point. More than
            one currency → 400, mirroring the chart endpoints.
            Applies to BOTH market types: a `primary` asset's fixed sale price
            converts exactly like a live orderbook quote (its mini-series is
            empty, so there is nothing to convert there).
            A conversion served with a stale FX rate is flagged in the asset's
            `fx` object (same shape as `RWAPrice.fx`; absent when fresh).
      responses:
        "200":
          description: List of RWA assets with latest price, 24h change and a 1d series.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol: { type: string, example: mars1-usdt }
                        base: { type: string, example: mars1 }
                        quote: { type: string, example: usdt }
                        native_quote: { type: string, example: usdt }
                        token_address: { type: string, nullable: true, example: KT1MarsToken }
                        market:
                          type: string
                          enum: [secondary, primary]
                          example: secondary
                        price: { type: number, nullable: true, example: 100.42 }
                        price_as_of: { type: string, format: date-time, nullable: true }
                        change_24h:
                          type: object
                          properties:
                            delta_abs: { type: number, nullable: true, example: 1.2 }
                            change_pct: { type: number, nullable: true, example: 1.21 }
                        series_1d:
                          type: object
                          properties:
                            interval: { type: string, example: 15m }
                            points:
                              type: array
                              items:
                                type: object
                                properties:
                                  t: { type: string, format: date-time }
                                  p: { type: number }
                        fx:
                          type: object
                          description: >
                            Present only when at least one `?in=` conversion
                            was served with a stale FX rate — same shape as
                            `RWAPrice.fx` (one `{rate_ts, stale}` object per
                            stale target).
                          additionalProperties:
                            type: object
                            properties:
                              rate_ts: { type: string, format: date-time }
                              stale: { type: boolean }
                        primary_issuance:
                          type: object
                          description: >
                            Present only when market=primary. Amounts are
                            raw on-chain nat strings (supply-scale values overflow
                            float64; divide by the token's decimals client-side).
                            progress_percent is computed server-side because the
                            indexer does not expose it.
                          properties:
                            launch_id: { type: integer, example: 6 }
                            name: { type: string, example: KHBE-issuance-v2 }
                            price:
                              type: number
                              example: 100
                              description: >
                                Base-tier (undiscounted) sale price in the asset's
                                quote currency. Present here as well as at the top
                                level so it survives when a live secondary quote
                                takes the top-level `price`.
                            price_as_of:
                              type: string
                              format: date-time
                              nullable: true
                              description: When the launchpad was last read.
                            status:
                              type: string
                              enum: [active, inactive, paused, closed]
                            active: { type: boolean, description: purchasable right now }
                            total_bought: { type: string, example: "6667" }
                            max_amount_cap: { type: string, example: "2500000000000" }
                            progress_percent: { type: number, example: 2.667e-7 }
                            sale_start: { type: string, format: date-time, nullable: true }
                            sale_end: { type: string, format: date-time, nullable: true }
              example:
                assets:
                  - symbol: mars1-usdt
                    base: mars1
                    quote: usdt
                    native_quote: usdt
                    token_address: KT1MarsToken
                    market: secondary
                    price: 100.42
                    price_as_of: "2026-07-24T11:59:30Z"
                    change_24h: { delta_abs: 1.2, change_pct: 1.21 }
                    series_1d:
                      interval: 15m
                      points:
                        - { t: "2026-07-23T12:00:00Z", p: 99.1 }
                        - { t: "2026-07-24T11:45:00Z", p: 100.42 }
                  - symbol: khbe-usdt
                    base: khbe
                    quote: usdt
                    native_quote: usdt
                    token_address: KT1FBJnqyY3EHB8dpwZ51gZqHBAXZifxwDnc
                    market: primary
                    price: 100
                    price_as_of: "2026-07-27T09:00:00Z"
                    change_24h: { delta_abs: null, change_pct: null }
                    series_1d: { interval: 15m, points: [] }
                    primary_issuance:
                      launch_id: 6
                      name: KHBE-issuance-v2
                      status: active
                      active: true
                      price: 100
                      price_as_of: "2026-07-27T09:00:00Z"
                      total_bought: "6667"
                      max_amount_cap: "2500000000000"
                      progress_percent: 2.667e-7
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/rwa/{symbol}:
    get:
      tags: [prices-rwa]
      summary: List RWA last prices
      description: |
        Returns `last` price points for the pair identified by `{symbol}`
        (`{base}-{quote}`, case-insensitive, e.g. `mars1-usdt`) from
        `equiteez`. Window/latest semantics match `/v1/prices/{token}`.

        `?in=usd,eur,...` adds converted prices as flat top-level numeric
        keys per row. Targets that fail conversion are silently omitted;
        the row is still returned with the native `price`.

        **Primary-market assets.** A token still in primary issuance has no
        orderbook, so it is resolved from the launchpad catalog instead of
        `rwa_pairs`: `market` is `primary`, `price` is the fixed base-tier sale
        price, and a `primary_issuance` block carries sale progress. Such an
        asset has no trade history — the list endpoint returns `[]` for a
        from/to window and the single sale price in latest mode.

        An asset that trades AND is still in issuance carries both: the live
        quote as `price` (`market: secondary`) plus a `primary_issuance` block.
        On the list endpoint that block appears only in latest mode — a windowed
        response is a time series of trades, and repeating asset-level metadata
        on every row would bloat it.

        `?in=` applies to a `primary` asset's sale price exactly as it does to a
        live quote, converted at the launchpad read time the row reports as its
        `timestamp`. Per-target failures drop just that key, as elsewhere.
      operationId: listRWAPrices
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/InFilter"
      responses:
        "200":
          description: Array of RWAPrice objects (one per timestamp).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RWAPrice" }
              example:
                - { timestamp: "2026-04-27T12:00:00Z", native_quote: usdt, price: 100.42, market: secondary, usd: 100.4300, eur: 85.62 }
                - { timestamp: "2026-04-27T11:00:00Z", native_quote: usdt, price: 99.80, market: secondary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/rwa/{symbol}/series:
    get:
      tags: [charts-rwa]
      summary: Line chart (close-price series) for an RWA pair
      description: |
        Returns one `(t, p)` point per bucket — `p` is the bucket's `last`
        close price in the pair's native quote currency (`pair.QuoteSymbol`).
        Backed by the corresponding continuous aggregate
        (`rwa_quote_prices_{1m,1h,1d}`); 5m/15m/4h re-bucket on top of `_1m`
        and `_1h` at query time.

        History before service deploy depends on `equiteez_backfill.go`
        having been enabled.

        Optional `?in=<currency>` adds a flat top-level numeric key per
        point with the close price converted at the close-of-bucket FX
        rate. Cap = 1 — multiple comma-separated values
        return 400.
      operationId: rwaSeries
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/Interval"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ChartIn"
      responses:
        "200":
          description: Series response. `currency` is the pair's native quote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesResponse" }
              example:
                symbol: mars1-usdt
                currency: usdt
                kind: series
                interval: 1h
                points:
                  - { t: "2026-04-27T12:00:00Z", p: 100.42, usd: 100.4300 }
                  - { t: "2026-04-27T13:00:00Z", p: 99.80,  usd: 99.8050 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "416": { $ref: "#/components/responses/RangeNotSatisfiable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/rwa/{symbol}/ohlc:
    get:
      tags: [charts-rwa]
      summary: OHLC candles for an RWA pair
      description: |
        One candle per bucket on the `last` side, with
        `open / high / low / close` and a sample count (`n`). Volume is
        not on the wire — `/ohlcv` lifts that in Stage 4.

        Same `interval` / range cap semantics as `/series`.

        Optional `?in=<currency>` adds a nested object per candle with
        converted `o/h/l/c` plus `rate` and `rate_ts` (close-of-bucket FX).
        One rate per candle keeps the converted candle
        valid (`l ≤ o,c ≤ h`).
      operationId: rwaOHLC
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/Interval"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ChartIn"
      responses:
        "200":
          description: OHLC response. `currency` is the pair's native quote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OHLCResponse" }
              example:
                symbol: mars1-usdt
                currency: usdt
                kind: ohlc
                interval: 1h
                candles:
                  - t: "2026-04-27T12:00:00Z"
                    o: 100.50
                    h: 101.20
                    l: 100.00
                    c: 100.80
                    n: 60
                    usd:
                      o: 100.5503
                      h: 101.2506
                      l: 100.0500
                      c: 100.8504
                      rate: 1.0005
                      rate_ts: "2026-04-27T12:55:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "416": { $ref: "#/components/responses/RangeNotSatisfiable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/rwa/{symbol}/ohlcv:
    get:
      tags: [charts-rwa]
      summary: OHLCV candles for an RWA pair (Stage 4 — TODO)
      description: |
        Reserved URL. Returns **501** with code `OHLCV_NOT_IMPLEMENTED`
        until traded-volume from the `orderbook_order` event log lands.
        The existing `rwa_quote_prices.size` column is
        a top-of-book snapshot, not traded volume — using it would
        mislead the frontend. DTO shape is fixed (`OHLCVResponse`) so
        the frontend can build against this URL today.
      operationId: rwaOHLCV
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501":
          description: OHLCV is parked until Stage 4.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                code: OHLCV_NOT_IMPLEMENTED
                message: "OHLCV is not yet available;"

  /v1/rwa/{symbol}/latest:
    get:
      tags: [prices-rwa]
      summary: Latest RWA price
      description: |
        Freshest `last` price for the pair identified by `{symbol}`.
        Returns 404 when no `last` row exists yet.

        Optional `?in=usd,eur,...` adds converted prices as flat top-level
        numeric keys. Targets that fail conversion (no FX rate, unregistered
        quote currency, etc.) are silently omitted; the response stays 200.

        This endpoint also carries two optional enrichment blocks (absent on
        the list endpoint):
        - `ath` — all-time-high on the `last` side: native-quote `price` plus
          the `date` (YYYY-MM-DD) it occurred. Omitted when no aggregated
          history exists yet.
        - `price_one_year_ago` — most recent `last` price at or before now-1y,
          in native quote. Omitted when the pair is younger than one year.

        When `?in=` is supplied, both blocks also carry the same flat
        per-currency keys, converted at the snapshot's current FX rate (the
        same rate as the top-level price), for whichever currencies were
        requested in `?in=`.
        **Primary-market assets.** A token still in primary issuance has no
        orderbook, so it is resolved from the launchpad catalog instead of
        `rwa_pairs`: `market` is `primary`, `price` is the fixed base-tier sale
        price, and a `primary_issuance` block carries sale progress. Such an
        asset has no trade history — the list endpoint returns `[]` for a
        from/to window and the single sale price in latest mode.

        An asset that trades AND is still in issuance carries both: the live
        quote as `price` (`market: secondary`) plus a `primary_issuance` block.
        On the list endpoint that block appears only in latest mode — a windowed
        response is a time series of trades, and repeating asset-level metadata
        on every row would bloat it.

        `?in=` applies to a `primary` asset's sale price exactly as it does to a
        live quote, converted at the launchpad read time the row reports as its
        `timestamp`. Per-target failures drop just that key, as elsewhere.
      operationId: latestRWASnapshot
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/InFilter"
      responses:
        "200":
          description: Latest RWAPrice object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RWAPrice" }
              example:
                timestamp: "2026-04-27T12:00:00Z"
                native_quote: usdt
                price: 100.45
                market: secondary
                usd: 100.46
                eur: 85.63
                aed: 368.72
                ath:
                  price: 150.00
                  date: "2025-12-03"
                  usd: 150.02
                  eur: 127.88
                  aed: 550.95
                price_one_year_ago:
                  price: 82.30
                  usd: 82.31
                  eur: 70.16
                  aed: 302.30
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/rwa/{symbol}/change:
    get:
      tags: [prices-rwa]
      summary: Price change over fixed periods (24h / 7d / 30d) for an RWA pair
      description: |
        Returns price-change percentages for the RWA pair `{symbol}` in
        its native quote currency over each requested period. Same
        semantics as the FT `/change` endpoint (see null / div-by-zero
        notes there) — the only differences are:

        - Native price is single-currency (the pair's native quote,
          e.g. `usdt`).
        - Optional `?in=usd,eur,...` adds converted `now` prices as flat
          top-level numeric keys, same convention as
          `/v1/rwa/{symbol}/latest?in=`. The conversion uses the
          at-or-before FX rate matching the `now` timestamp — historical
          accuracy is preserved. A conversion served with a stale rate is
          flagged in the top-level `fx` object (absent when fresh).
        - Period anchors come from raw `rwa_quote_prices` via PK index
          seek, same data source as `now` for symmetry.
      operationId: rwaChange
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/Periods"
        - $ref: "#/components/parameters/InFilter"
      responses:
        "200":
          description: Price change response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RWAChangeResponse" }
              example:
                symbol: mars1-usdt
                native_quote: usdt
                as_of: "2026-05-08T12:00:00Z"
                now: 56.25
                usd: 56.2528
                eur: 47.8740
                periods:
                  "24h": { from_ts: "2026-05-07T12:00:00Z", from: 55.80, delta_abs: 0.45, change_pct: 0.8065 }
                  "7d":  { from_ts: "2026-05-01T00:00:00Z", from: 54.10, delta_abs: 2.15, change_pct: 3.9741 }
                  "30d": { from_ts: "2026-04-08T00:00:00Z", from: 51.20, delta_abs: 5.05, change_pct: 9.8633 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/tickers/{token}/latest:
    get:
      tags: [prices-tickers]
      summary: Latest per-exchange tickers for a token
      description: |
        Returns one row per `(exchange, target_symbol)` for `{token}`,
        ordered by 24h base-token volume descending (ties broken by
        exchange, then target). Each row carries the native `last_price`
        in `target` units, `volume_24h_base` in token units, and a
        query-time-computed `change_24h_pct` (null when no row falls
        inside the `[ts-25h, ts-24h]` anchor bracket — cold start,
        ingestion gap, delisting).

        Rows whose latest `ts` is older than `server.ticker_stale_after`
        (default 1h) are filtered out by default. Set `?include_stale=true`
        to receive them with `is_stale: true`.

        Optional `?in=usd,eur,...` adds a nested `in.<target>` block per
        row carrying the converted `price`, `volume_24h`, and FX
        metadata. Conversion uses the FT-side `token_prices` series as
        the FX source. Per-target failures populate
        `in.<target>.fx.error`; numeric fields are omitted but the parent
        response stays 200.
      operationId: latestTickers
      parameters:
        - $ref: "#/components/parameters/Token"
        - $ref: "#/components/parameters/InFilter"
        - $ref: "#/components/parameters/IncludeStale"
      responses:
        "200":
          description: Tickers snapshot for the token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TickersSnapshot" }
              example:
                source: coingecko
                entity: mvrk
                timestamp: "2026-05-29T12:00:00Z"
                tickers:
                  - exchange: binance
                    exchange_name: Binance
                    exchange_kind: cex
                    logo_url: "https://example.com/binance.png"
                    target: btc
                    pair: MVRK/BTC
                    last_price: "0.000021"
                    volume_24h_base: "1234567.89"
                    change_24h_pct: "5.34"
                    bid_ask_spread_pct: "0.10"
                    trust_score: green
                    is_stale: false
                    is_anomaly: false
                    trade_url: "https://www.binance.com/en/trade/MVRK_BTC"
                    in:
                      usd:
                        price: "0.0853"
                        volume_24h: "104938.27"
                        fx:
                          rate: "4063.95"
                          source: coingecko
                          ts: "2026-05-29T11:58:00Z"
                          method: rate
                          stale: false
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/tickers/{token}/distribution:
    get:
      tags: [prices-tickers]
      summary: Volume distribution (pie chart) for a token
      description: |
        Aggregates the latest-per-pair `volume_24h_base` into one row per
        group. `?group_by=exchange` groups by exchange (one bar per
        exchange, summing across all quote targets); `?group_by=target`
        groups by quote currency (one bar per target, summing across all
        exchanges). `share_pct` is each group's share of `total_volume_base`.

        Stale rows (older than `server.ticker_stale_after`) are **always**
        excluded server-side — the pie chart is about current market
        structure, not historical state. There is no `?include_stale=` on
        this endpoint.

        Optional `?in=usd,eur,...` adds a nested `in.<target>` block per
        row carrying converted `volume_24h`. Per-target failures populate
        `fx.error` and omit the numeric value; response stays 200.

        When `total_volume_base` is zero (cold start, all volumes nil), the
        endpoint returns 200 with an empty `rows` array.
      operationId: tickerDistribution
      parameters:
        - $ref: "#/components/parameters/Token"
        - $ref: "#/components/parameters/GroupBy"
        - $ref: "#/components/parameters/InFilter"
      responses:
        "200":
          description: Volume distribution rows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TickerDistribution" }
              example:
                source: coingecko
                entity: mvrk
                timestamp: "2026-05-29T12:00:00Z"
                group_by: exchange
                total_volume_base: "5432109.50"
                rows:
                  - exchange: binance
                    exchange_name: Binance
                    exchange_kind: cex
                    logo_url: "https://example.com/binance.png"
                    volume_24h_base: "2345678.10"
                    share_pct: "43.180000"
                    in:
                      usd:
                        volume_24h: "199382.50"
                        fx:
                          rate: "0.085"
                          source: coingecko
                          ts: "2026-05-29T11:58:00Z"
                          method: rate
                          stale: false
                  - exchange: kraken
                    exchange_name: Kraken
                    exchange_kind: cex
                    volume_24h_base: "1234567.89"
                    share_pct: "22.730000"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/pairs/rwa:
    get:
      tags: [discovery]
      summary: Catalog of enabled RWA assets (orderbook pairs + launches)
      description: |
        Returns the catalog of enabled RWA assets currently served by the API:
        orderbook pairs (`market: secondary`) unioned with primary-issuance
        launches (`market: primary`), so a client discovers every
        `{base}-{quote}` symbol the `/v1/rwa` endpoints serve. The `symbol`
        field is ready to use verbatim.

        Each entry carries the on-chain addresses a transaction-building
        consumer needs: `token_addr` (the RWA token), `quote_addr` (the
        settlement/payment token) and `orderbook_addr` (the escrow contract).
        For `primary` entries `quote_addr` is the launchpad payment token —
        taken from the same sale-option payment that sets the base-tier price —
        while `orderbook_addr` is always null: a primary sale is not settled
        through the orderbook escrow; its payment flow is the launchpad's own
        domain.

        Union semantics mirror `GET /v1/rwa`: an asset that trades AND is
        still in issuance appears once, as `secondary`.

        Order is stable: `(source, base, quote)` ascending. Disabled entries
        are never returned. Empty database returns `[]` (200), not 404.
      operationId: listRWAPairs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Array of catalog entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RWAPairCatalogEntry" }
              example:
                - symbol: khbe-usdt
                  base: khbe
                  quote: usdt
                  market: primary
                  token_addr: KT1FBJnqyY3EHB8dpwZ51gZqHBAXZifxwDnc
                  quote_addr: KT19bKTs9qsoBrspRNwsHn46YarEWuj3Vjc6
                  orderbook_addr: null
                  source: equiteez
                - symbol: ntbm-usdt
                  base: ntbm
                  quote: usdt
                  market: secondary
                  token_addr: KT1Xd6Q4TokenAddr
                  quote_addr: KT1VAymQuoteAddr
                  orderbook_addr: KT1A3JhOrderbook
                  source: equiteez
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        MBIO API-Gateway RS256 JWT (Bearer). Required on /v1/rwa/* and
        /v1/pairs/rwa when they are served on the PUBLIC listener; the internal
        listener serves these routes without auth. A missing or invalid token
        returns 401 UNAUTHORIZED.
  parameters:
    Token:
      name: token
      in: path
      required: true
      description: Lowercase token symbol from the registered set (e.g. `mvrk`, `usdt`).
      schema:
        type: string
        pattern: "^[a-z0-9]{1,16}$"
        example: mvrk

    Symbol:
      name: symbol
      in: path
      required: true
      description: |
        Pair symbol in `{base}-{quote}` form (case-insensitive),
        e.g. `mars1-usdt`. The split is on the LAST hyphen so future
        bases containing a dash (e.g. `x-at-usdt`) keep parsing.
      schema:
        type: string
        pattern: "^[A-Za-z0-9-]{3,64}$"
        example: mars1-usdt

    From:
      name: from
      in: query
      required: false
      description: Window start (RFC3339, UTC). When set without `to`, `to` defaults to now.
      schema:
        type: string
        format: date-time
        example: "2026-04-01T00:00:00Z"

    To:
      name: to
      in: query
      required: false
      description: Window end (RFC3339, UTC). When set without `from`, `from` defaults to `now-24h`.
      schema:
        type: string
        format: date-time
        example: "2026-04-02T00:00:00Z"

    Limit:
      name: limit
      in: query
      required: false
      description: |
        Cap on returned rows. Validated against `server.max_query_limit`
        (default 10000) and, when a time window is requested, defaulted to it —
        a windowed response is never unbounded.

        Truncation direction when a window holds more rows than the cap:
        LIST endpoints (`/v1/prices/{token}`, `/v1/rwa/{symbol}`, `/quotes`)
        keep the OLDEST rows — page forward by re-issuing with `from` just
        past the last timestamp seen. CHART endpoints (`/series`, `/ohlc`)
        keep the NEWEST buckets. Truncation is not otherwise signaled.
      schema:
        type: integer
        minimum: 1
        example: 100

    CurrencyFilter:
      name: currency
      in: query
      required: false
      description: Comma-separated quote currency filter — `usd`, `usd,eur`, etc. Validated against the supported registry.
      schema:
        type: string
        example: usd,eur

    IncludeStale:
      name: include_stale
      in: query
      required: false
      description: |
        When `true`, return ticker rows whose `ts` is older than
        `server.ticker_stale_after` (default 1h) — flagged with
        `is_stale: true`. Default `false` hides them.
      schema:
        type: boolean
        default: false
        example: false

    GroupBy:
      name: group_by
      in: query
      required: true
      description: |
        Aggregation dimension for `/v1/tickers/:token/distribution`.
        `exchange` groups by exchange identifier (one row per exchange,
        summing across all quote targets). `target` groups by quote
        currency (one row per target, summing across all exchanges).
      schema:
        type: string
        enum: [exchange, target]
        example: exchange

    InFilter:
      name: in
      in: query
      required: false
      description: |
        Comma-separated list of target currencies for read-side conversion
        (e.g. `usd`, `usd,eur,aed`). Each must be a registered quote
        currency in `prices.AllSupportedCurrencies` — unknown values
        return 400. The server caps the list length via
        `server.max_in_currencies` (default 10).

        Conversion uses the FT-side `token_prices` series as the FX
        source: for a pair quoted in `USDT`, `?in=usd` looks up the
        latest `USDT/USD` rate from CoinGecko and multiplies. Per-target
        failures are silently omitted from the response (the key is absent);
        the request stays 200 as long as the native price was found.
      schema:
        type: string
        example: "usd,eur,aed"

    Interval:
      name: interval
      in: query
      required: true
      description: |
        Bucket size for the chart. `raw` is reserved for tick-level series
        (rejected for `/ohlc` and `/ohlcv`, and not yet supported for FA
        charts). Per-interval window caps apply (see the range parameters).
      schema:
        type: string
        enum: [raw, 1m, 5m, 15m, 1h, 4h, 1d]
        example: 1h

    ChartCurrency:
      name: currency
      in: query
      required: true
      description: |
        Single quote currency for the series (e.g. `usd`, `eur`). FA charts
        filter `quote_currency` directly in SQL; only one value per request,
        no comma-list. Validated against `prices.AllSupportedCurrencies`.
      schema:
        type: string
        example: usd

    ChartIn:
      name: in
      in: query
      required: false
      description: |
        Single target currency for close-of-bucket FX conversion.
        Each chart endpoint caps `?in=` to one value — comma-separated lists
        return 400. Used by RWA charts to convert from the pair's native
        quote (e.g. `usdt`) to a registered currency (`usd`, `eur`, …).
        FA charts ignore the parameter; multi-currency lives in storage.

        Per-target failures (no FX rate, unregistered source) drop the key
        silently — the request stays 200.
      schema:
        type: string
        example: usd

    Periods:
      name: periods
      in: query
      required: false
      description: |
        Comma-separated list of lookback periods for the `/change` endpoint.
        Each value must be from the closed whitelist `{1h, 24h, 7d, 30d}`.
        Default when omitted: `24h,7d,30d`. Order is preserved in the
        response (duplicates are dropped).
      schema:
        type: string
        example: "24h,7d,30d"

  responses:
    BadRequest:
      description: "Invalid request parameters (`code: INVALID_ARGUMENT`)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { code: INVALID_ARGUMENT, message: "Invalid 'limit' parameter: exceeds maximum" }
    NotFound:
      description: "Token, pair, or row not found (`code: NOT_FOUND`)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { code: NOT_FOUND, message: "Token not found" }
    Conflict:
      description: |
        Resource state cannot be uniquely resolved (`code: CONFLICT`).
        For RWA: 2+ enabled `rwa_pairs` rows match the requested
        `{base}-{quote}` symbol. The `details.pair_ids` field lists the
        conflicting IDs; resolution is operator-side (e.g. disable one row).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            code: CONFLICT
            message: "rwa pair ambiguous for mars1-usdt: 2 enabled rows"
            details: { pair_ids: [42, 77] }
    RangeNotSatisfiable:
      description: |
        The requested `from..to` window exceeds the per-interval cap
        (`code: RANGE_NOT_SATISFIABLE`). Distinct from
        `400 INVALID_ARGUMENT` so clients can render a "narrow your range"
        UX without parsing the message. Caps: `1m` ≤ 7d, `5m` ≤ 30d,
        `15m` ≤ 90d, `1h` ≤ 1y, `4h` ≤ 4y; `1d` is unlimited.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { code: RANGE_NOT_SATISFIABLE, message: "Time range exceeds cap for interval '1m'" }
    RateLimited:
      description: "Inbound rate-limit exceeded (`code: RATE_LIMITED`)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { code: RATE_LIMITED, message: "Too many requests" }
    Unauthorized:
      description: |
        Missing, malformed, expired, or unverifiable Bearer JWT
        (`code: UNAUTHORIZED`). Returned by the MBIO JWT middleware on the
        public listener's RWA routes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { code: UNAUTHORIZED, message: "Authorization header required" }
    Forbidden:
      description: |
        Token verified but unusable — e.g. missing `sub` or invalid claims
        (`code: FORBIDDEN`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { code: FORBIDDEN, message: "JWT missing subject" }
    Internal:
      description: "Unexpected server error (`code: INTERNAL`)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    LegacyErrorResponse:
      type: object
      description: |
        Frozen v0.1.0 error envelope used ONLY by the deprecated `/quotes`
        route for its own 400/500 errors. All v1 endpoints use
        `ErrorResponse`.
      required: [error]
      properties:
        error:
          type: string
          example: "Invalid 'from' parameter format. Use RFC3339 format (e.g., 2023-01-01T00:00:00Z)"

    TokenPricePoint:
      type: object
      required: [timestamp, currency, price]
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-04-27T12:00:00Z"
        currency:
          type: string
          description: Quote currency (lowercase ISO/crypto code).
          example: usd
        price:
          type: number
          description: Price at wire precision (6 dp at or above 0.01, else 6 significant digits), serialised as a JSON number.
          example: 0.071541

    RWAPrice:
      type: object
      description: |
        One RWA price observation. `price` is the `last` trade price in
        the orderbook's native quote currency (e.g. 56.25 USDT), at wire
        precision (6 dp at or above 0.01, else 6 significant digits) and
        serialised as a JSON number.

        When `?in=usd,eur,...` is requested, each successfully converted
        currency appears as an additional top-level numeric key (lowercase
        ISO-4217 code). Targets that fail conversion are silently absent —
        the response stays 200 as long as the native price was found. A
        conversion served with a stale FX rate is flagged in the `fx` object.

        Top-level reserved keys: `timestamp`, `native_quote`, `price`,
        `market`, and the optional `primary_issuance`, `fx`, and — on
        `/latest` only — `ath` / `price_one_year_ago` objects. All other
        top-level keys are converted currencies (3-letter codes that can
        never collide with the reserved names).
      required: [timestamp, native_quote, price, market]
      properties:
        timestamp:
          type: string
          format: date-time
          description: RFC3339 UTC, second precision.
          example: "2026-04-27T12:00:00Z"
        native_quote:
          type: string
          description: |
            Lowercase ticker of the orderbook's settlement currency
            (`rwa_pairs.quote_symbol`).
          example: usdt
        price:
          type: number
          description: |
            Last price in `native_quote` at wire precision (6 dp at or above
            0.01, else 6 significant digits). Serialised as a JSON number (not
            a quoted string).
          example: 100.45
        market:
          type: string
          enum: [secondary, primary]
          description: |
            How the asset is priced: `secondary` = live orderbook quote,
            `primary` = fixed launchpad sale price (the `primary_issuance`
            block carries the sale detail).
          example: secondary
        primary_issuance:
          $ref: "#/components/schemas/RWAPrimaryIssuance"
        fx:
          type: object
          description: |
            Present only when at least one `?in=` conversion was served with
            an FX rate older than the freshness budget
            (`server.fx_max_staleness_seconds`). One key per stale target.
          additionalProperties:
            type: object
            required: [rate_ts, stale]
            properties:
              rate_ts:
                type: string
                format: date-time
                description: Timestamp of the FX rate actually used.
              stale:
                type: boolean
                enum: [true]
        ath:
          $ref: "#/components/schemas/RWAAllTimeHigh"
        price_one_year_ago:
          $ref: "#/components/schemas/RWAPriceAt"
      additionalProperties:
        type: number
        description: |
          Converted price for a target currency from `?in=`.
          Key is the lowercase ISO-4217 code (`usd`, `eur`, `aed`, …).
          At wire precision (6 dp at or above 0.01, else 6 significant digits).

    RWAPrimaryIssuance:
      type: object
      description: |
        Launchpad facet for an asset in primary issuance (`primary_issuance`
        key). Present on `market: primary` assets, and on `market: secondary`
        latest-mode responses when the asset also still sells on the launchpad.
      required: [launch_id, name, status, active, price, total_bought, max_amount_cap, progress_percent]
      properties:
        launch_id: { type: integer, example: 6 }
        name: { type: string, example: KHBE-issuance-v2 }
        status:
          type: string
          enum: [active, inactive, paused, closed]
        active:
          type: boolean
          description: Purchasable right now.
        price:
          type: number
          description: Base-tier (undiscounted) sale price in the asset's quote currency, 6 dp.
          example: 100
        price_as_of:
          type: string
          format: date-time
          nullable: true
        total_bought:
          type: string
          description: Raw on-chain nat (supply-scale values overflow float64).
          example: "6667"
        max_amount_cap:
          type: string
          description: Raw on-chain nat.
          example: "2500000000000"
        progress_percent:
          type: number
          description: total_bought / max_amount_cap × 100, precomputed server-side.
          example: 2.667e-7
        sale_start: { type: string, format: date-time, nullable: true }
        sale_end: { type: string, format: date-time, nullable: true }

    RWAAllTimeHigh:
      type: object
      description: |
        All-time-high block on `/v1/rwa/{symbol}/latest` (the `ath` key).
        Computed on the `last` side. `price` is the peak in native quote;
        `date` is the day it occurred.

        When `?in=` is supplied, each requested currency appears as an
        additional top-level numeric key, converted at the snapshot's current
        FX rate (the same rate as the top-level price), NOT the ATH date.

        Reserved keys: `price`, `date`. All other keys are converted
        currencies.
      required: [price, date]
      properties:
        price:
          type: number
          description: Highest recorded price in native quote, 6 d.p.
          example: 150.00
        date:
          type: string
          description: YYYY-MM-DD (UTC) of the day the ATH occurred.
          example: "2025-12-03"
      additionalProperties:
        type: number
        description: |
          ATH price converted to a `?in=` target at the snapshot's current
          FX rate. Lowercase ISO-4217 key. Absent when conversion failed.

    RWAPriceAt:
      type: object
      description: |
        Price-one-year-ago block on `/v1/rwa/{symbol}/latest` (the
        `price_one_year_ago` key). The most recent `last` observation at or
        before now-1y, in native quote.

        When `?in=` is supplied, each requested currency appears as an
        additional top-level numeric key, converted at the snapshot's current
        FX rate (the same rate as the top-level price).

        Reserved key: `price`. All other keys are converted currencies.
      required: [price]
      properties:
        price:
          type: number
          description: The year-ago price in native quote, 6 d.p.
          example: 82.30
      additionalProperties:
        type: number
        description: |
          Year-ago price converted to a `?in=` target at the snapshot's
          current FX rate. Lowercase ISO-4217 key. Absent when conversion
          failed.

    RWAPairCatalogEntry:
      type: object
      description: |
        One enabled RWA asset in the discovery catalog: an orderbook pair
        (`market: secondary`) or a primary-issuance launch (`market: primary`).
        `symbol` is `${base}-${quote}`, ready to pass to `/v1/rwa/{symbol}`.
      required: [symbol, base, quote, market, source]
      properties:
        symbol:
          type: string
          description: Canonical `{base}-{quote}`, lowercase.
          example: ntbm-usdt
        base:
          type: string
          description: Lowercase base asset ticker.
          example: ntbm
        quote:
          type: string
          description: Lowercase quote currency ticker.
          example: usdt
        market:
          type: string
          enum: [secondary, primary]
          description: >
            How the asset is priced — live orderbook quote (`secondary`) or
            fixed launchpad sale price (`primary`). Same discriminator as the
            /v1/rwa endpoints.
        token_addr:
          type: string
          nullable: true
          description: On-chain contract of the RWA token; null when not synced yet.
          example: KT1Xd6Q4TokenAddr
        quote_addr:
          type: string
          nullable: true
          description: >
            On-chain contract of the quote (settlement/payment) token. For
            `secondary` entries this is the orderbook's currency token; for
            `primary` entries it is the launchpad payment token backing the
            base-tier price. Null for entries not yet re-synced since the
            column was introduced.
          example: KT1VAymQuoteAddr
        orderbook_addr:
          type: string
          nullable: true
          description: >
            On-chain orderbook (escrow) contract. Always null for `primary`
            entries — a primary sale's payment flow is the launchpad's domain.
          example: KT1A3JhOrderbook
        source:
          type: string
          description: Upstream provider code (matches `sources.code`).
          example: equiteez

    Snapshot:
      type: object
      description: Transposed view — all metrics for one token at one timestamp.
      required: [timestamp, values]
      properties:
        timestamp:
          type: string
          format: date-time
          description: RFC3339 UTC, second precision.
        values:
          type: object
          description: |
            Map of currency → price at wire precision (6 dp at or above 0.01,
            else 6 significant digits) and
            serialised as a JSON number (not a quoted string).
          additionalProperties:
            type: number
          example:
            usd: 0.071541
            eur: 0.060941

    CountResponse:
      type: object
      required: [token, count]
      properties:
        token:
          type: string
        count:
          type: integer
          format: int64
          minimum: 0

    LivenessResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [alive]
        service:
          type: string

    ReadinessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, unready, draining]
        reason:
          type: string
          description: Present only on non-ready responses.
          enum: [shutting_down, db_handle_unavailable, db_unreachable]

    ChartEnvelope:
      type: object
      description: Top-level metadata block on every chart response.
      required: [symbol, currency, kind, interval]
      properties:
        symbol:
          type: string
          description: |
            For FA charts — the token id (e.g. `mvrk`). For RWA charts —
            the `{base}-{quote}` pair symbol (e.g. `mars1-usdt`).
          example: mvrk
        currency:
          type: string
          description: |
            Quote currency the series is denominated in. For FA charts —
            the requested `?currency=`. For RWA charts (when wired) — the
            pair's native quote, or the requested `?in=` target.
          example: usd
        kind:
          type: string
          enum: [series, ohlc, ohlcv]
        interval:
          type: string
          enum: [raw, 1m, 5m, 15m, 1h, 4h, 1d]

    SeriesPoint:
      type: object
      description: |
        One row of a `/series` response. When `?in=<currency>` is supplied
        the converted close price appears as an additional top-level
        numeric key (lowercase ISO-4217 code; never collides with `t`/`p`).
      required: [t, p]
      properties:
        t:
          type: string
          format: date-time
          description: Bucket start time (RFC3339 UTC).
        p:
          type: number
          description: Bucket close price at wire precision (6 dp at or above 0.01, else 6 significant digits).
      additionalProperties:
        type: number
        description: Converted close price for a `?in=` target currency.

    ChartCandle:
      type: object
      description: |
        One candle without volume. When `?in=<currency>` is supplied the
        converted o/h/l/c plus `rate`/`rate_ts` appear as a nested object
        keyed by the target currency.
      required: [t, o, h, l, c, n]
      properties:
        t: { type: string, format: date-time, description: Bucket start time (RFC3339 UTC). }
        o: { type: number, description: Open price (rounded to 6 dp). }
        h: { type: number, description: High price. }
        l: { type: number, description: Low price. }
        c: { type: number, description: Close price. }
        n: { type: integer, format: int64, description: Sample count (raw rows aggregated). }
      additionalProperties:
        $ref: "#/components/schemas/ConvertedCandle"

    ConvertedCandle:
      type: object
      description: |
        One bucket's OHLC after close-of-bucket FX conversion. Same rate
        applies to all four price fields, keeping the candle valid
        (`l ≤ o,c ≤ h`). `rate_ts` is the timestamp of the FX point that
        produced the rate — fronts can show staleness without re-querying.
      required: [o, h, l, c, rate, rate_ts]
      properties:
        o:       { type: number }
        h:       { type: number }
        l:       { type: number }
        c:       { type: number }
        rate:    { type: number, description: Multiplier applied to native o/h/l/c. }
        rate_ts: { type: string, format: date-time }

    ChartCandleVol:
      allOf:
        - $ref: "#/components/schemas/ChartCandle"
        - type: object
          required: [vb, vq]
          properties:
            vb: { type: number, description: Volume in base token (Stage 4). }
            vq: { type: number, description: Volume in quote token (Stage 4). }

    SeriesResponse:
      type: object
      description: Wire shape for `/series`.
      required: [symbol, currency, kind, interval, points]
      allOf:
        - $ref: "#/components/schemas/ChartEnvelope"
        - type: object
          properties:
            points:
              type: array
              items: { $ref: "#/components/schemas/SeriesPoint" }

    OHLCResponse:
      type: object
      description: Wire shape for `/ohlc`.
      required: [symbol, currency, kind, interval, candles]
      allOf:
        - $ref: "#/components/schemas/ChartEnvelope"
        - type: object
          properties:
            candles:
              type: array
              items: { $ref: "#/components/schemas/ChartCandle" }

    OHLCVResponse:
      type: object
      description: |
        Wire shape for `/ohlcv` once Stage 4 ships volume ingestion. Until
        then `/ohlcv` returns 501 with code `OHLCV_NOT_IMPLEMENTED` and
        this schema is informational only — frontend can build against it.
      required: [symbol, currency, kind, interval, candles]
      allOf:
        - $ref: "#/components/schemas/ChartEnvelope"
        - type: object
          properties:
            candles:
              type: array
              items: { $ref: "#/components/schemas/ChartCandleVol" }

    ChangePeriod:
      type: object
      description: |
        One period's contribution to a `/change` response. All four
        fields are nullable — when no anchor row falls inside the
        period's tolerance window, all four are `null`. When the
        anchor exists but is `0` (degenerate price), `from` and
        `from_ts` stay populated but `delta_abs` and `change_pct`
        are `null` so the client can distinguish "no history" from
        "change undefined".
      properties:
        from_ts:
          type: string
          format: date-time
          nullable: true
          description: Bucket-start timestamp of the anchor row (UTC RFC3339), or `null` when missing.
        from:
          type: number
          nullable: true
          description: Anchor price (CA bucket close) at wire precision, or `null`.
        delta_abs:
          type: number
          nullable: true
          description: "`now − from`, signed, at wire precision — a sub-0.01 delta keeps 6 significant digits rather than collapsing to 0. `null` when `from` is missing or zero."
        change_pct:
          type: number
          nullable: true
          description: "`(now − from) / from × 100`, signed, at wire precision — a move under 0.01% keeps 6 significant digits rather than reading as flat. `null` when `from` is missing or zero."

    FTChangeForCurrency:
      type: object
      properties:
        now:
          type: number
          nullable: true
          description: Latest sample for this currency (matches `/latest`).
        periods:
          type: object
          description: Map keyed by period code (`1h`, `24h`, `7d`, `30d`).
          additionalProperties: { $ref: "#/components/schemas/ChangePeriod" }
      required: [now, periods]

    FTChangeResponse:
      type: object
      required: [token, as_of, currencies]
      properties:
        token:
          type: string
          example: mvrk
        as_of:
          type: string
          format: date-time
          nullable: true
          description: |
            `max(per-currency last_ts)`. Matches the snapshot semantics of
            `/latest`. Per-currency `now` may be staler than `as_of` for
            slow-tick currencies — read the per-currency value, not this
            top-level timestamp, when reasoning about staleness.
            `null` when no currency has data yet.
        currencies:
          type: object
          description: Map keyed by currency code (`usd`, `eur`, …).
          additionalProperties: { $ref: "#/components/schemas/FTChangeForCurrency" }

    RWAChangeResponse:
      type: object
      required: [symbol, native_quote, as_of, now, periods]
      properties:
        symbol:
          type: string
          example: mars1-usdt
        native_quote:
          type: string
          example: usdt
        as_of:
          type: string
          format: date-time
          nullable: true
          description: '`null` when no `last` row exists yet for the pair.'
        now:
          type: number
          nullable: true
        periods:
          type: object
          description: Map keyed by period code (`1h`, `24h`, `7d`, `30d`).
          additionalProperties: { $ref: "#/components/schemas/ChangePeriod" }
        fx:
          type: object
          description: |
            Present only when at least one `?in=` conversion of `now` was
            served with an FX rate older than the freshness budget
            (`server.fx_max_staleness_seconds`). One key per stale target —
            same shape as `RWAPrice.fx`. Absent when every rate was fresh.
          additionalProperties:
            type: object
            required: [rate_ts, stale]
            properties:
              rate_ts:
                type: string
                format: date-time
                description: Timestamp of the FX rate that was used.
              stale:
                type: boolean
                example: true
      additionalProperties:
        type: number
        description: |
          Per-target FX-converted `now` value when `?in=` is supplied
          (one numeric key per requested currency that succeeded).
          Same flat-top-level-key convention as `/v1/rwa/{symbol}/latest`.

    TickersSnapshot:
      type: object
      description: |
        Envelope for `/v1/tickers/:token/latest`. One row per
        `(exchange, target_symbol)`. Ticker numbers are full-precision JSON
        **strings** (preserving `numeric(38,18)`) — unlike the FT/RWA price
        endpoints, which serve JSON numbers at wire precision.
      required: [source, entity, timestamp, tickers]
      properties:
        source:
          type: string
          description: Upstream source code (e.g. `coingecko`).
          example: coingecko
        entity:
          type: string
          description: Token symbol (lowercase).
          example: mvrk
        timestamp:
          type: string
          format: date-time
          description: Newest `ts` across all returned rows.
        tickers:
          type: array
          items: { $ref: "#/components/schemas/TickerRow" }

    TickerRow:
      type: object
      description: One per-exchange ticker datapoint inside `TickersSnapshot`.
      required: [exchange, exchange_name, exchange_kind, target, pair, last_price, is_stale, is_anomaly, change_24h_pct]
      properties:
        exchange:
          type: string
          description: CoinGecko market identifier (FK to `exchanges.id`).
          example: binance
        exchange_name:
          type: string
          example: Binance
        exchange_kind:
          type: string
          enum: [cex, dex]
          description: |
            Centralized vs decentralized exchange. Derived in code via
            a hard-coded DEX allowlist; default `cex`.
        logo_url:
          type: string
          description: |
            URL of the exchange logo (CoinGecko Pro `include_exchange_logo`
            flag). Omitted when upstream omits it.
        target:
          type: string
          description: Quote symbol of the pair (lowercase), e.g. `btc`, `usdt`.
          example: btc
        pair:
          type: string
          description: Human label `{TOKEN}/{TARGET}` uppercased.
          example: MVRK/BTC
        last_price:
          type: string
          description: |
            Price of 1 token in `target` units, as a JSON string with
            full `numeric(38,18)` precision.
          example: "0.000021"
        volume_24h_base:
          type: string
          description: |
            24h trading volume in **token units** (e.g. count of MVRK).
            The key is OMITTED (not null) when upstream omits the value.
          example: "1234567.89"
        change_24h_pct:
          type: string
          nullable: true
          description: |
            Price change over 24h as percent, rounded to 6dp. Null when no
            row falls inside the `[ts-25h, ts-24h]` anchor bracket (cold
            start, ingestion gap, exchange delisted then relisted, etc.) —
            an older row outside the bracket is deliberately NOT used, so a
            multi-week move is never reported as a 24h change.
          example: "5.34"
        bid_ask_spread_pct:
          type: string
          description: The key is OMITTED (not null) when upstream omits it.
          example: "0.10"
        trust_score:
          type: string
          description: Upstream trust score (`green` / `yellow` / `red` / "").
          example: green
        is_stale:
          type: boolean
          description: |
            Derived from `ts < now - server.ticker_stale_after`. Always
            `false` on the default `/latest` response (stale rows are
            filtered); only appears `true` when `?include_stale=true`.
        is_anomaly:
          type: boolean
          description: |
            True when CoinGecko flagged the entry as anomalous or stale at
            ingest time. Caller-facing — UI may want to dim the row.
        trade_url:
          type: string
          description: Direct deep link into the exchange's trade UI.
        in:
          type: object
          description: |
            Per-`?in=` projection. Present only when `?in=` was supplied
            and at least one target succeeded. Each key is a lowercase
            ISO-4217 / asset code that matches the request.
          additionalProperties: { $ref: "#/components/schemas/ConvertedTickerBlock" }

    ConvertedTickerBlock:
      type: object
      description: |
        Per-target conversion result for one `TickerRow`. `price` and
        `volume_24h` may be omitted when conversion failed — in that
        case `fx.error` is populated and the parent response stays 200.
      required: [fx]
      properties:
        price:
          type: string
          description: |
            `last_price` converted to the target currency
            (FX(target_symbol → currency) × last_price).
          example: "0.0853"
        volume_24h:
          type: string
          nullable: true
          description: |
            `volume_24h_base` converted to the target currency
            (FX(token → currency) × volume_24h_base). Null when upstream
            omitted the base volume.
          example: "104938.27"
        fx:
          $ref: "#/components/schemas/TickerFXMeta"

    TickerFXMeta:
      type: object
      description: |
        FX metadata for one conversion. On success, `rate`/`source`/`ts`
        are populated and `error` is empty. On failure, `error` carries
        the reason and the numeric fields are absent.
      properties:
        rate:
          type: string
          example: "4063.95"
        source:
          type: string
          example: coingecko
        ts:
          type: string
          format: date-time
          description: Timestamp of the FX rate (at-or-before the row `ts`).
        method:
          type: string
          enum: [rate, identity]
          description: |
            `identity` when source-token == target-currency (rate=1, no
            upstream lookup). `rate` otherwise.
        stale:
          type: boolean
          description: |
            True when the FX rate is older than `server.fx_max_staleness_seconds`
            (default 300s). Still served; UI may want to flag. Past a fixed 26h
            hard cap the conversion is refused instead — here the block is
            returned with `error: no_rate`, while the flat `?in=` shapes drop
            the currency key entirely.
        error:
          type: string
          enum: [no_rate, unsupported_target, unregistered_source, query_error]
          description: Populated only when conversion failed for this target.

    TickerDistribution:
      type: object
      description: |
        Envelope for `/v1/tickers/:token/distribution`. One row per group
        (exchange or target) with summed `volume_24h_base` and `share_pct`.
        `share_pct` over all returned rows sums to ~100 (±epsilon).
      required: [source, entity, timestamp, group_by, total_volume_base, rows]
      properties:
        source:
          type: string
          example: coingecko
        entity:
          type: string
          example: mvrk
        timestamp:
          type: string
          format: date-time
        group_by:
          type: string
          enum: [exchange, target]
        total_volume_base:
          type: string
          description: |
            Sum of `rows[].volume_24h_base` across all returned groups,
            in token units. Zero when there's no usable data yet — `rows`
            is empty in that case.
          example: "5432109.50"
        rows:
          type: array
          items: { $ref: "#/components/schemas/TickerDistributionRow" }

    TickerDistributionRow:
      type: object
      description: |
        One slice of the pie. Exactly one of `exchange` or `target` is
        populated, depending on the `group_by` mode.
      required: [volume_24h_base, share_pct]
      properties:
        exchange:
          type: string
          description: |
            Exchange identifier (present when `group_by=exchange`).
            Omitted under `group_by=target`.
          example: binance
        exchange_name:
          type: string
        exchange_kind:
          type: string
          enum: [cex, dex]
        logo_url:
          type: string
        target:
          type: string
          description: |
            Quote currency symbol (present when `group_by=target`).
            Omitted under `group_by=exchange`.
          example: btc
        volume_24h_base:
          type: string
          description: Group's summed volume in token units.
          example: "2345678.10"
        share_pct:
          type: string
          description: |
            `volume_24h_base / total_volume_base × 100`, rounded to 6dp.
          example: "43.180000"
        in:
          type: object
          description: Per-`?in=` converted volume block, omitted when no `?in=`.
          additionalProperties: { $ref: "#/components/schemas/ConvertedVolumeBlock" }

    ConvertedVolumeBlock:
      type: object
      description: |
        Per-target conversion result for one `TickerDistributionRow`.
        Slimmer than `ConvertedTickerBlock` — pies only convert volume,
        never a price.
      required: [fx]
      properties:
        volume_24h:
          type: string
          description: |
            Group volume in the target currency
            (FX(token → currency) × volume_24h_base).
          example: "199382.50"
        fx:
          $ref: "#/components/schemas/TickerFXMeta"

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [INVALID_ARGUMENT, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, RANGE_NOT_SATISFIABLE, UNAVAILABLE, INTERNAL, RATE_LIMITED, OHLCV_NOT_IMPLEMENTED, NOT_IMPLEMENTED]
        message:
          type: string
          description: Client-safe message. Internal causes are NOT included; check server logs by `request_id` for the underlying error.
        details:
          type: object
          additionalProperties: true
          description: |
            Optional machine-readable disambiguation. Currently set only on
            `CONFLICT` responses for RWA symbol lookup, where it contains
            `pair_ids: int64[]` of the conflicting rows.
