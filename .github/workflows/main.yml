name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
    tags:
      - "*.*.*"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default every job (including deploy) to a read-only token; jobs that need
# more must ask explicitly.
permissions:
  contents: read

env:
  GO_VERSION: '1.25.x'

jobs:
  lint-build:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup and install
        uses: ./.github/actions/setup-and-install
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go version
        run: go version

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

      - name: Test (race + coverage)
        run: |
          go test -race -timeout 10m -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -5

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

      - name: Build binary
        run: go build -trimpath -ldflags "-w -s" ./cmd/quotes

  openapi-lint:
    name: OpenAPI lint (Redocly)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node is preinstalled on ubuntu-latest; setup-node pins the version
      # and gives us a clean PATH. We could also use `docker://redocly/cli`
      # via uses: but setup-node + npx is faster and more transparent.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cache the global npm dir so npx doesn't redownload @redocly/cli
      # every run. The key is intentionally version-bumped only on
      # @redocly/cli major upgrades — otherwise we'd thrash the cache.
      - name: Cache @redocly/cli
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-redocly-cli-v1

      # `.redocly.yaml` at the repo root holds the rule overrides; the
      # spec path is passed explicitly so older redocly versions that
      # don't auto-resolve `apis.default` still work. Identical command
      # to `make openapi-lint`.
      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli@latest lint docs/openapi.yaml

  integration-tests:
    name: Integration Tests (testcontainers)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Runs the //go:build integration test files in tests/integration/...
    # which spin up a TimescaleDB testcontainer per package (see
    # tests/integration/setup_test.go). Docker is preinstalled on
    # ubuntu-latest; testcontainers-go uses it natively — no service
    # container is needed.
    #
    # Independent of lint-build (no `needs:`) so the two jobs run in
    # parallel. docker-publish gates on both via `needs:` below.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup and install
        uses: ./.github/actions/setup-and-install
        with:
          go-version: ${{ env.GO_VERSION }}

      # Same command as `make test-integration` — kept inline so CI logs
      # show the exact flags and timeout. -race catches concurrent
      # singleflight/cache misuse the integration suite exercises.
      - name: Run integration tests
        run: go test -race -timeout 15m -tags=integration ./tests/integration/...

  docker-publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint-build, openapi-lint, integration-tests]
    permissions:
      contents: read
    # Deploys to prod: bind to the `production` environment so required
    # reviewers / deployment branch+tag rules configured in repo settings
    # gate this job (any *.*.* tag on any commit deploys otherwise).
    environment: production
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha

      - name: Build and push production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push migration image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: migration
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-migration
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}

      - name: Check ArgoCD connection
        uses: clowdhaus/argo-cd-action@f26660fba71360cd8bff27f49b9666f6ea701197 # v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: 3.1.8
          command: version
          options: >
            --grpc-web
            --server ${{ secrets.ARGOCD_URL }}
            --auth-token ${{ secrets.ARGOCD_TOKEN }}

      - name: Update ArgoCD app with new production image tag
        uses: clowdhaus/argo-cd-action@f26660fba71360cd8bff27f49b9666f6ea701197 # v2.3.0
        with:
          version: 3.1.8
          command: app set network-mavryk-external-data
          options: >
            -p image.tag=${{ steps.meta.outputs.version }}
            --grpc-web
            --server ${{ secrets.ARGOCD_URL }}
            --auth-token ${{ secrets.ARGOCD_TOKEN }}
            --revision main

      - name: Sync ArgoCD app
        uses: clowdhaus/argo-cd-action@f26660fba71360cd8bff27f49b9666f6ea701197 # v2.3.0
        with:
          version: 3.1.8
          command: app sync network-mavryk-external-data
          options: >
            --grpc-web
            --server ${{ secrets.ARGOCD_URL }}
            --prune
            --auth-token ${{ secrets.ARGOCD_TOKEN }}
            --revision main
