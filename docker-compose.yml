services:
  # Official Timescale image: TimescaleDB + PostgreSQL. Extension is preinstalled;
  # `migrations/001_init.sql` still runs `CREATE EXTENSION IF NOT EXISTS timescaledb` (safe).
  # Override with e.g. TIMESCALEDB_IMAGE=timescale/timescaledb:2.16.1-pg16 for a pinned build.
  # If you switch from plain postgres: wipe the volume once: `docker compose down -v` (data loss).
  postgres:
    # Pinned tag (not latest-pg16): a floating tag can pull a newer TimescaleDB
    # binary against an old catalog on volume reuse and refuse to start until
    # `ALTER EXTENSION timescaledb UPDATE`. Override via TIMESCALEDB_IMAGE.
    image: ${TIMESCALEDB_IMAGE:-timescale/timescaledb:2.26.3-pg16}
    container_name: mavryk-external-data-postgres
    restart: unless-stopped
    # Bound memory so a runaway query can't take the whole host (and with it the
    # app container) via the OOM killer. shm_size gives Postgres room for parallel
    # query/sort work that would otherwise fault on the default 64m.
    mem_limit: 1g
    shm_size: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-quotes}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Fail fast if unset rather than silently booting a superuser DB with the
      # well-known default password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      # Bind to loopback only. Docker's published ports bypass host firewalls, so
      # "5432:5432" would expose Postgres to the whole network. The app reaches it
      # over the internal bridge by service name; host publishing is dev-only.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # NOTE: the ./migrations initdb bind-mount was removed. It shadowed the
      # image's own timescaledb init script and re-ran every migration under a
      # stricter psql regime (double execution). The dedicated `migration`
      # service is the single migration path (it gates the app via
      # service_completed_successfully).
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mavryk-external-data-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-quotes}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    container_name: mavryk-external-data-migration
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-quotes}
    networks:
      - mavryk-external-data-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: mavryk-external-data-app
    restart: unless-stopped
    # Cap app memory: background jobs + in-process caches + up to 10k-row queries
    # shouldn't be able to starve the host into a restart loop.
    mem_limit: 512m
    ports:
      - "${SERVER_PORT:-3010}:3010"
    environment:
      # Server Configuration
      SERVER_PORT: ${SERVER_PORT:-3010}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      # Local-dev stack runs gin debug mode explicitly: with no
      # SERVER_INTERNAL_PORT set, debug is what keeps /metrics mounted on the
      # public listener (a single-port release deploy serves none) and enables
      # gin's verbose route logging. Never set debug in a production deploy.
      SERVER_GIN_MODE: ${SERVER_GIN_MODE:-debug}

      # Auth: the image ships auth ON by default. This is a local-dev stack, so
      # disable MBIO JWT verification explicitly here (dev/CI convenience). Do NOT
      # carry this into a production deploy — leave AUTH_ENABLED unset there so the
      # RWA routes require a token on the public listener.
      AUTH_ENABLED: ${AUTH_ENABLED:-false}

      # Database Configuration
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-quotes}
      POSTGRES_SSL: ${POSTGRES_SSL:-disable}
      POSTGRES_LOGGING: ${POSTGRES_LOGGING:-false}

      # Job configuration
      JOB_INTERVAL_SECONDS: ${JOB_INTERVAL_SECONDS:-60}
      JOB_ENABLED: ${JOB_ENABLED:-true}

      # API configuration
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-30}
      # Inbound rate limit (0 = off). The old API_RATE_LIMIT_RPS var was read by
      # nothing — these are the knobs the server actually consumes.
      SERVER_RATE_LIMIT_RPS: ${SERVER_RATE_LIMIT_RPS:-0}
      SERVER_RATE_LIMIT_BURST: ${SERVER_RATE_LIMIT_BURST:-0}

      # CoinGecko API configuration
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-api_key}
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3}

      # Backfill configuration
      BACKFILL_ENABLED: ${BACKFILL_ENABLED:-false}
      BACKFILL_START_FROM: ${BACKFILL_START_FROM:-}
      BACKFILL_SLEEP_MS: ${BACKFILL_SLEEP_MS:-3000}
      BACKFILL_CHUNK_MINUTES: ${BACKFILL_CHUNK_MINUTES:-360}
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - mavryk-external-data-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3010/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

networks:
  mavryk-external-data-network:
    driver: bridge
