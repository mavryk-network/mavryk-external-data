server:
  port: "3010"
  # internal_port: second HTTP listener for intra-cluster callers. RWA routes
  # are open here (no MBIO JWT) and /metrics, /docs, /openapi.yaml move here.
  # Empty (the local default) = single-port mode — everything on `port`.
  # In k8s the helm chart sets SERVER_INTERNAL_PORT=3011 via env, splitting
  # the listeners. Uncomment locally only if you want to mirror that split.
  # internal_port: "3011"
  host: "0.0.0.0"
  # gin_mode: debug | release | test. Empty → derive from host (localhost → debug).
  # gin_mode: "release"
  read_timeout: "30s"
  write_timeout: "30s"
  read_header_timeout: "10s"
  idle_timeout: "120s"
  # In-process snapshot cache TTL (seconds). 0 disables.
  latest_quote_cache_ttl_seconds: 5
  # Hard cap on the ?limit= query param. 0 = use compiled default (10000).
  max_query_limit: 10000
  # /v1/tickers/:token/latest hides rows whose `ts` is older than this by default.
  # `?include_stale=true` returns them with is_stale=true. /distribution always
  # excludes stale rows regardless of caller flag.
  ticker_stale_after: "1h"
  pprof_enabled: false
  # Per-handler ctx timeout (request budget). Omitted/0 selects the 10s
  # default; a NEGATIVE duration disables it. /debug/pprof is exempt.
  handler_timeout: "10s"
  # During shutdown /readyz returns 503 for this many seconds before HTTP shutdown.
  shutdown_drain_seconds: 5
  # Inbound rate limit. RPS=0 disables. /healthz and /readyz are exempt.
  # Env overrides: SERVER_RATE_LIMIT_{RPS,BURST,PER_IP}.
  rate_limit:
    rps: 0
    burst: 0
    per_ip: true
  # LB/proxy CIDRs whose X-Forwarded-For is honored for per-IP limiting.
  # Empty = trust no proxy (ClientIP = direct peer). Env: SERVER_TRUSTED_PROXIES.
  # trusted_proxies: ["10.0.0.0/8"]

# No password / ssl_mode here: this file is baked into the production image.
# Local dev falls back to the in-code defaults (postgres / prefer); deployed
# envs must set POSTGRES_PASSWORD (+ POSTGRES_SSL). Nothing enforces this at
# startup — a missing value silently falls back to the dev default, and release
# mode only logs a warning.
database:
  host: "localhost"
  port: "5432"
  user: "postgres"
  name: "quotes"
  # Pool tuning. 0 = driver default; production should set explicit values.
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "30m"
  # Batch size for CreateInBatches across all repositories. 0 = compiled default (500).
  batch_size: 500

job:
  interval_seconds: 60
  enabled: true
  # Bound parallel CoinGecko collections per tick. 0 = unlimited.
  concurrency: 4

api:
  timeout_seconds: 30
  # Transport pool tuning. 0 keeps in-code defaults.
  transport_max_idle_conns: 100
  transport_max_idle_conns_per_host: 10
  transport_max_conns_per_host: 100
  transport_idle_conn_timeout: "90s"
  transport_tls_handshake_timeout: "10s"
  # Cap response body bytes from any outbound HTTP call (16 MiB).
  outbound_max_response_bytes: 16777216
  outbound_http_retry_max_attempts: 3
  outbound_http_retry_initial_ms: 200
  outbound_http_retry_max_ms: 5000
  outbound_http_circuit_breaker_disabled: false
  outbound_http_circuit_breaker_interval_seconds: 60
  outbound_http_circuit_breaker_open_seconds: 30
  outbound_http_circuit_breaker_half_open_max_requests: 1
  outbound_http_circuit_breaker_trip_after_failures: 5

coingecko:
  api_key: ""
  base_url: "https://api.coingecko.com/api/v3"
  rate_limit:
    rps: 8
    burst: 16

equiteez:
  # Indexer via the public worker (injects the Hasura admin-secret and gates by
  # origin/domain). Keep the *_password empty in deployed envs; set it locally/in
  # CI so the client passes ?bypass=<secret> to the worker (see .env.example).
  indexer_url: ""
  indexer_password: ""
  rate_limit:
    rps: 0
    burst: 0

# Backfill — reverse fetch into token_prices.
backfill:
  enabled: false
  start_from: ""
  min_start_from: ""
  tick_seconds: 5
  jitter_ms: 1000
  chunk_minutes: 360
  backfill_max_errors: 5
  backoff_initial_ms: 2000
  backoff_max_ms: 60000
  max_backoff_ms: 86400000

# RWA orderbook collector. Enable once rwa_pairs has at least one row.
rwa:
  enabled: false
  interval_seconds: 60
  # How often the Equiteez allowlist is re-read into rwa_pairs. Bounds how long
  # a newly listed asset stays invisible; the collector re-reads rwa_pairs every
  # tick, so no restart is involved. 0 = in-code default (3600).
  pair_sync_interval_seconds: 3600

# Per-exchange ticker collector. Polls CoinGecko /coins/{id}/tickers on a fixed
# cadence and serves /v1/tickers/:token/latest + /distribution.
# Default off — flip after migrations 0012/0013/0014 are applied.
tickers:
  enabled: false
  token_symbol: "mvrk"
  interval_seconds: 300
  http_timeout: "10s"
  include_exchange_logo: true
  cache:
    latest_ttl_seconds: 30
    distribution_ttl_seconds: 60

# MBIO JWT verification for the public listener's RWA routes (/v1/rwa/*,
# /v1/pairs/rwa). Internal listener traffic skips this entirely.
#
# - enabled: unset here means default-ON (verify). This file is baked into the
#   production image, so it must NOT ship `enabled: false` — that would flip the
#   secure default off in the deployed artifact. Disable auth for local dev / CI
#   only via the AUTH_ENABLED=false env var (see .env / .env.example), never here.
#   The flag does not affect the internal listener.
# - mbio_jwt_issuer: required when enabled. MBIO uses the plain string
#   "mbio-api-gateway", not a URL.
# - mbio_jwt_audience: optional. MBIO does not currently mint `aud`, so leaving
#   this empty is the correct default. A startup warn-log fires when empty.
# - jwt_local_verify_public_key: base64-PEM of an RSA public key. When set it
#   replaces the MBIO JWKS trust anchor in ANY gin mode (nothing refuses it at
#   startup; the middleware logs a warning), so keep it to local / CI.
auth:
  # enabled: <intentionally unset — defaults to true/verify; disable via AUTH_ENABLED=false env>
  mbio_jwt_base_url: ""
  mbio_jwt_issuer: "mbio-api-gateway"
  mbio_jwt_audience: ""
  jwks_cache_ttl: "5m"
  jwt_local_verify_public_key: ""

# Per-token live/backfill overrides.
tokens:
  mvrk:
    interval_seconds: 60
    enabled: true
    timeout_seconds: 30
    min_time_range_seconds: 60
    max_chunk_minutes: 720
    backfill:
      enabled: true
      start_from: "2025-09-18T14:00:00Z"
      chunk_minutes: 360
  usdt:
    interval_seconds: 240
    enabled: true
    timeout_seconds: 45
    min_time_range_seconds: 60
    max_chunk_minutes: 720
    backfill:
      enabled: true
      start_from: "2025-12-18T00:00:00Z"
      chunk_minutes: 360
